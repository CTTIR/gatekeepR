on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions: read-all

jobs:
  lint:
    uses: CTTIR/.github/.github/workflows/lint.yaml@main
    with:
      blocking: true
      # The shared house linters are the blocking vocabulary/style contract.
      # The repository predates the optional default linters; enabling them
      # would turn hundreds of existing advisory findings into a release gate.
      with-defaults: false
